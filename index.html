<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a1524"><title>Mijn datumtellers</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(circle at 15% 20%,#0d6674 0,transparent 28%),radial-gradient(circle at 85% 40%,#183d83 0,transparent 34%),linear-gradient(145deg,#071017,#152039 70%,#070d1b);background-attachment:fixed}main{max-width:850px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:clamp(25px,7vw,35px);margin:0;letter-spacing:-.7px}header p{margin:5px 0 0;color:#bac7d3;font-size:14px}button{font:inherit;cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #64c8ff;outline-offset:2px}.primary{background:#fff;color:#12233a;padding:12px 17px;border-radius:22px;font-weight:700;white-space:nowrap}.counter{position:relative;background:rgba(5,10,17,.75);border:1px solid rgba(255,255,255,.12);border-radius:34px;padding:25px 18px 20px;margin:0 0 17px;box-shadow:0 18px 55px #0003;overflow:hidden;isolation:isolate}.counter:before{content:'';position:absolute;z-index:-1;width:180px;height:180px;border-radius:50%;background:rgba(11,125,179,.17);right:8%;top:8%;filter:blur(4px)}.head{display:flex;align-items:start;justify-content:space-between;gap:8px}.name{font-size:clamp(23px,6vw,37px);line-height:1.15;font-weight:500;overflow-wrap:anywhere}.date{font-size:clamp(16px,4.5vw,24px);color:#aab2be;margin-top:10px}.actions{display:flex;gap:5px}.small{background:#ffffff16;color:white;border-radius:13px;padding:9px 10px;font-size:17px}.status{font-size:13px;color:#a8d9f4;margin-top:16px}.digits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 5px;margin-top:13px;text-align:center}.digit{font-size:clamp(27px,8vw,57px);font-weight:300;line-height:1.15;font-variant-numeric:tabular-nums}.unit{font-size:clamp(11px,3.1vw,18px);margin-top:6px;color:#e5e9ee}.progress{height:8px;border-radius:10px;background:#ffffff18;margin-top:23px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#1bc5db,#6fa9ff);width:0;transition:width .5s}.empty{text-align:center;background:#ffffff10;border:1px solid #ffffff18;border-radius:25px;padding:45px 25px;color:#c9d8e5}dialog{width:min(92vw,430px);border:1px solid #ffffff30;border-radius:25px;background:#152237;color:white;padding:23px}dialog::backdrop{background:#000a}dialog h2{margin:0 0 20px}label{display:block;font-size:14px;color:#d4e0ea;margin:15px 0 7px}input{width:100%;border:1px solid #536579;background:#0a1524;color:white;padding:14px;border-radius:12px;font-size:17px;color-scheme:dark}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.secondary{background:#ffffff20;color:#fff;border-radius:18px;padding:12px 16px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:-8px 0 20px}.tools button{font-size:13px}.hint{font-size:12px;color:#9fb2c4;margin-top:14px;line-height:1.5}@media(min-width:620px){.digits{grid-template-columns:repeat(7,minmax(0,1fr))}.counter{padding:30px}.digit{font-size:clamp(30px,4.8vw,55px)}}@media(max-width:380px){.digits{gap:12px 2px}.unit{font-size:11px}.counter{padding:20px 12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div><h1>Mijn datumtellers</h1><p>Tel af naar of op vanaf jouw momenten</p></div><button class="primary" id="add">+ Nieuw</button></header><div class="tools"><button class="secondary" id="backup">↓ Back-up maken</button><button class="secondary" id="restore">↑ Back-up terugzetten</button><input id="backupfile" type="file" accept=".json,application/json" hidden></div><section id="list" aria-live="off"></section><p class="hint">Je tellers worden op dit apparaat in deze browser opgeslagen. Wis je browsergegevens, dan kunnen je tellers verdwijnen.</p></main><dialog id="editor"><form id="form"><h2 id="formtitle">Nieuwe teller</h2><label for="name">Naam</label><input id="name" maxlength="70" placeholder="Bijvoorbeeld: Vakantie" required><label for="target">Datum</label><input id="target" type="date" required><label for="clock">Tijd</label><input id="clock" type="time" value="00:00" required><div class="formactions"><button class="secondary" type="button" id="cancel">Annuleren</button><button class="primary" type="submit">Opslaan</button></div></form></dialog><script>
(()=>{'use strict';const KEY='mijn-datumtellers-v1',list=document.getElementById('list'),dialog=document.getElementById('editor'),form=document.getElementById('form');let items=[],editing=null;try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))items=raw.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(x.when))}catch(e){}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('Opslaan is niet gelukt. Controleer de opslagruimte of browserinstellingen.')}};const pad=n=>String(n).padStart(2,'0');const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const fmt=new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parts(a,b){let y=b.getFullYear()-a.getFullYear();let m=b.getMonth()-a.getMonth();let anchor=new Date(a.getTime());anchor.setFullYear(a.getFullYear()+y);if(anchor>b){y--;anchor=new Date(a.getTime());anchor.setFullYear(a.getFullYear()+y)}let next=new Date(anchor.getTime());next.setMonth(next.getMonth()+1);while(next<=b){anchor=next;m++;next=new Date(anchor.getTime());next.setMonth(next.getMonth()+1)}m=0;anchor=new Date(a.getTime());anchor.setFullYear(a.getFullYear()+y);while(true){next=new Date(anchor.getTime());next.setMonth(next.getMonth()+1);if(next>b)break;anchor=next;m++}let remaining=Math.max(0,Math.floor((b-anchor)/1000));const weeks=Math.floor(remaining/604800);remaining%=604800;const days=Math.floor(remaining/86400);remaining%=86400;const hours=Math.floor(remaining/3600);remaining%=3600;return [y,m,weeks,days,hours,Math.floor(remaining/60),remaining%60]}
// Calendar arithmetic: add years/months without allowing day-of-month overflow.
function addMonthsClamped(date,n){const d=new Date(date.getTime());const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d}
function difference(a,b){let years=b.getFullYear()-a.getFullYear();while(years>0&&addMonthsClamped(a,years*12)>b)years--;let months=0;let anchor=addMonthsClamped(a,years*12);while(months<11&&addMonthsClamped(a,years*12+months+1)<=b)months++;anchor=addMonthsClamped(a,years*12+months);let secs=Math.max(0,Math.floor((b-anchor)/1000));let weeks=Math.floor(secs/604800);secs%=604800;let days=Math.floor(secs/86400);secs%=86400;let hours=Math.floor(secs/3600);secs%=3600;return [years,months,weeks,days,hours,Math.floor(secs/60),secs%60]}
const units=['Jaar','Maanden','Weken','Dagen','Uur','Minuten','Seconden'];function render(){if(!items.length){list.innerHTML='<div class="empty">Nog geen datumtellers.<p>Voeg je eerste datum toe met <strong>+ Nieuw</strong>.</p></div>';return}list.innerHTML=items.map(x=>{const d=new Date(x.when);return `<article class="counter" data-id="${esc(x.id)}"><div class="head"><div><div class="name">${esc(x.name)}</div><div class="date">${fmt.format(d)}</div></div><div class="actions"><button class="small" data-action="edit" aria-label="Wijzig ${esc(x.name)}">✎</button><button class="small" data-action="delete" aria-label="Verwijder ${esc(x.name)}">×</button></div></div><div class="status"></div><div class="digits">${units.map(u=>`<div><div class="digit">0</div><div class="unit">${u}</div></div>`).join('')}</div><div class="progress"><span></span></div></article>`}).join('');tick()}
function tick(){const now=new Date();for(const el of list.querySelectorAll('.counter')){const item=items.find(x=>x.id===el.dataset.id);if(!item)continue;const date=new Date(item.when),future=date>now,exact=Math.abs(date-now)<1000;el.querySelector('.status').textContent=exact?'Het moment is aangebroken':future?'Nog te gaan':'Tijd verstreken';const vals=difference(future?now:date,future?date:now);el.querySelectorAll('.digit').forEach((node,i)=>node.textContent=vals[i]);const total=Math.abs(date-now);const p=100-(total%86400000)/864000;el.querySelector('.progress span').style.width=`${Math.max(0,Math.min(100,p))}%`}}
function openEditor(id){editing=id||null;const item=items.find(x=>x.id===id);document.getElementById('formtitle').textContent=item?'Teller wijzigen':'Nieuwe teller';document.getElementById('name').value=item?.name||'';document.getElementById('target').value=item?.when.slice(0,10)||localDate(new Date());document.getElementById('clock').value=item?.when.slice(11,16)||'00:00';dialog.showModal()}
document.getElementById('backup').onclick=()=>{const blob=new Blob([JSON.stringify({app:'mijn-datumtellers',version:1,items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mijn-datumtellers-backup-'+localDate(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};document.getElementById('restore').onclick=()=>document.getElementById('backupfile').click();document.getElementById('backupfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='mijn-datumtellers'||!Array.isArray(data.items)||!data.items.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(x.when)))throw Error('Ongeldig back-upbestand');if(confirm('Alle huidige datumtellers vervangen door '+data.items.length+' tellers uit de back-up?')){items=data.items;save();render()}}catch(err){alert('Back-up kan niet worden ingelezen: '+err.message)}finally{e.target.value=''}};document.getElementById('add').onclick=()=>openEditor(null);document.getElementById('cancel').onclick=()=>dialog.close();form.onsubmit=e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),when=document.getElementById('target').value+'T'+document.getElementById('clock').value;if(!name||!Number.isFinite(new Date(when).getTime()))return;const item={id:editing||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2)),name,when};if(editing){items=items.map(x=>x.id===editing?item:x)}else items.unshift(item);save();dialog.close();render()};list.onclick=e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const id=btn.closest('.counter').dataset.id;const item=items.find(x=>x.id===id);if(!item)return;if(btn.dataset.action==='edit')openEditor(id);else if(confirm(`Teller “${item.name}” verwijderen?`)){items=items.filter(x=>x.id!==id);save();render()}};render();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})})();
</script></body></html>
